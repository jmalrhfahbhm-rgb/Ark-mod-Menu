name: Build ArkMenu

on:
  push:
  workflow_dispatch:

jobs:
  dex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java and produce classes.dex
        run: |
          set -ex
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLATFORM="$SDK/platforms/android-35"
          BT="$SDK/build-tools/35.0.0"
          test -f "$PLATFORM/android.jar"
          test -x "$BT/d8"
          find . -name '*.java' -not -path './build/*' > sources.txt
          cat sources.txt
          test -s sources.txt
          mkdir -p build/classes out
          javac --release 8 -cp "$PLATFORM/android.jar" -d build/classes @sources.txt
          "$BT/d8" --release --min-api 24 --lib "$PLATFORM/android.jar" \
            --output out $(find build/classes -name '*.class')
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: classes-dex
          path: out/classes.dex
