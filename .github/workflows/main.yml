name: Build ArkMenu

on:
  push:
  workflow_dispatch:

jobs:
  dex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repo files
        run: |
          pwd
          ls -R . | head -50

      - name: Compile Java and produce classes.dex
        run: |
          set -ex
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLATFORM=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          mkdir -p build/classes out
          javac --release 8 -cp "$PLATFORM/android.jar" -d build/classes java/*.java
          "$BT/d8" --release --min-api 24 --lib "$PLATFORM/android.jar" \
            --output out $(find build/classes -name '*.class')
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: classes-dex
          path: out/classes.dex
