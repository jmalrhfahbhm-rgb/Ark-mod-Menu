name: Build Ark Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build DEX and Compile Java
      run: |
        echo "Starting Java Compilation..."
        mkdir -p build/classes
        # تجميع ملفات الجافا الثلاثة معاً
        javac -source 1.8 -target 1.8 FloatingMenu.java MenuData.java NativeBridge.java -d build/classes
        
        echo "Converting to DEX format..."
        # تحميل أداة dx الرسمية لتحويل الملفات إلى صيغة الأندرويد dex
        wget https://github.com -O dx.jar
        java -jar dx.jar --dex --output=classes.dex build/classes/
        
    - name: Upload Mod Files
      uses: actions/upload-artifact@v4
      with:
        name: Ark-Mod-Menu-DEX
        path: classes.dex
        
